<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span data-translate="login.title">تسجيل الدخول</span> - <span data-translate="app_name">وصفتي</span></title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <script src="{{ url_for('static', filename='js/translator.js') }}"></script>
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .login-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        .login-form {
            margin-top: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        
        .input-group input {
            padding-right: 50px;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .alert-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="rtl">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fa fa-prescription-bottle-medical"></i>
                </div>
                <h1 class="login-title" data-translate="app_name">وصفتي</h1>
                <p class="login-subtitle" data-translate="app_subtitle">نظام الوصفات الطبية الذكي</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="alert-container">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fa fa-exclamation-circle"></i>
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
            {% endwith %}
            
            <form method="POST" class="login-form">
                <div class="form-group">
                    <label class="form-label required" data-translate="login.username">اسم المستخدم</label>
                    <div class="input-group">
                        <input type="text" name="username" class="form-control" 
                               data-translate="login.username_placeholder" placeholder="أدخل اسم المستخدم" required autofocus>
                        <i class="fa fa-user"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required" data-translate="login.password">كلمة المرور</label>
                    <div class="input-group">
                        <input type="password" name="password" class="form-control" 
                               data-translate="login.password_placeholder" placeholder="أدخل كلمة المرور" required>
                        <i class="fa fa-lock"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fa fa-sign-in-alt"></i> <span data-translate="login.login_button">تسجيل الدخول</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p><span data-translate="login.default_user">المستخدم الافتراضي</span>: <strong>admin</strong> | <span data-translate="login.default_password">كلمة المرور</span>: <strong>admin123</strong></p>
            </div>
        </div>
    </div>
</body>
</html>
